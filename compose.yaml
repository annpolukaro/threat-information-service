
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: threat_user
      POSTGRES_PASSWORD: threat_password
      POSTGRES_DB: threats_db
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_threats.sql:/docker-entrypoint-initdb.d/001_create_threats.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat_user -d threats_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://threat_user:threat_password@postgres:5432/threats_db?sslmode=disable
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

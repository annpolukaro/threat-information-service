
services:
  postgres:
    image: postgres:17-alpine
    container_name: threat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: threat_user
      POSTGRES_PASSWORD: threat_password
      POSTGRES_DB: threats_db

    ports:
      - "127.0.0.1:15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat_user -d threats_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:

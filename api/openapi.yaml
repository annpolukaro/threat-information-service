
openapi: 3.0.0

info:
  title: Information Exchange Service
  description: |
    REST API для обмена информацией об угрозах.

    API позволяет создавать, получать и обновлять информацию
    о вредоносных файлах по их MD5-хешу.

    Ограничение запросов:
    - 10 запросов в секунду.
    - Максимум 20 запросов в короткий промежуток времени.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Локальный сервер

paths:
  /info:
    post:
      summary: Создать новую угрозу
      description: |
        Создаёт запись об угрозе.
        MD5 должен быть уникальным.
        Обязательные поля: md5 и name.
      operationId: createThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatCreateRequest'
            example:
              md5: d41d8cd98f00b204e9800998ecf8427e
              name: Trojan.Win32.Generic
              description: Обнаружена вредоносная программа
              threat_type: trojan
              severity: high
      responses:
        '201':
          description: Угроза успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /info/{md5}:
    parameters:
      - name: md5
        in: path
        required: true
        description: MD5-хеш файла (32 шестнадцатеричных символа)
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
        example: d41d8cd98f00b204e9800998ecf8427e

    get:
      summary: Получить информацию об угрозе
      description: Возвращает полную информацию об угрозе по MD5-хешу.
      operationId: getInfoByMd5
      responses:
        '200':
          description: Информация об угрозе успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      summary: Обновить информацию об угрозе
      description: |
        Полностью обновляет редактируемые поля существующей угрозы.
        MD5 передаётся в URL и не изменяется.
        Обязательное поле: name.
      operationId: updateThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatUpdateRequest'
            example:
              name: Trojan.Win32.Updated
              description: Обновлённое описание угрозы
              threat_type: trojan
              severity: critical
      responses:
        '200':
          description: Информация об угрозе успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    ThreatCreateRequest:
      type: object
      required:
        - md5
        - name
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          description: MD5-хеш файла
          example: d41d8cd98f00b204e9800998ecf8427e
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Название угрозы
          example: Trojan.Win32.Generic
        description:
          type: string
          description: Описание угрозы
          example: Обнаружена вредоносная программа
        threat_type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        first_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Время первого обнаружения угрозы

    ThreatUpdateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Новое название угрозы
        description:
          type: string
          description: Новое описание угрозы
        threat_type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        first_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Время первого обнаружения угрозы

    ThreatResponse:
      type: object
      required:
        - md5
        - name
        - description
        - threat_type
        - severity
        - first_seen_at
        - created_at
        - updated_at
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          description: MD5-хеш файла
        name:
          type: string
          description: Название угрозы
        description:
          type: string
          description: Описание угрозы
        threat_type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        first_seen_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ThreatType:
      type: string
      enum:
        - trojan
        - virus
        - worm
        - ransomware
        - spyware
        - other
      default: other
      description: Тип угрозы

    Severity:
      type: string
      enum:
        - low
        - medium
        - high
        - critical
      default: medium
      description: Уровень опасности

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Описание ошибки
          example: Threat not found
        details:
          type: string
          description: Дополнительная информация
          example: No threat with specified MD5 found

  responses:
    BadRequest:
      description: Некорректные данные запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Угроза не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Угроза с таким MD5 уже существует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Превышено допустимое количество запросов
      headers:
        Retry-After:
          description: Время ожидания перед повторной попыткой
          schema:
            type: integer
            example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Too many requests

    ServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
